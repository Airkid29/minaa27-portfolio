backend:
  name: git-gateway
  branch: main

# Configuration d'authentification via Netlify Identity
# (les utilisateurs sont gérés dans l'interface Netlify > Identity)
identity:
  gateway: true

# Publication directe (pas de workflow éditorial) : chaque modification
# publiée est commit directement sur la branche "main", ce qui déclenche
# un nouveau déploiement Netlify automatiquement.
publish_mode: simple

# ⚠️ Ces champs media_folder / public_folder sont OBLIGATOIRES pour Decap CMS
# (même si on n'utilise PLUS les uploads d'images intégrés). Ils permettent
# à Decap de démarrer correctement. Le vrai mode d'emploi pour les images :
# héberge tes photos sur Cloudinary / PostImage.org / Imgur et colle l'URL
# directe (https://… .jpg/.png/.webp) dans les champs « URL — Image… ».
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "fr"

site_url: https://minaa27.netlify.app
display_url: https://minaa27.netlify.app
logo_url: /assets/icons/favicon.svg

collections:
  # ------------------------------------------------------------------
  # PROFIL — fichier unique
  # ------------------------------------------------------------------
  - name: "profile"
    label: "Profil"
    files:
      - name: "profile"
        label: "Mon profil"
        file: "content/profile/profile.json"
        fields:
          - { label: "Nom complet", name: "name", widget: "string" }
          - { label: "Pseudo", name: "handle", widget: "string" }
          - { label: "Phrase d'accroche (Hero)", name: "tagline", widget: "string" }
          - { label: "Positionnement complet", name: "positioning", widget: "string" }
          - { label: "Petite étiquette au-dessus du titre", name: "hero_kicker", widget: "string", required: false }
          - label: "URL — Photo principale (Hero)"
            name: "hero_photo"
            widget: "string"
            hint: "URL directe (https://… en .jpg/.png/.webp). Ex : héberge sur PostImage.org ou Cloudinary, colle le lien direct ici."
          - label: "URL — Photo section « Mon Univers »"
            name: "about_photo"
            widget: "string"
            hint: "URL directe de l'image. Héberge-la en ligne puis colle le lien."
          - { label: "Biographie courte", name: "bio_short", widget: "text" }
          - { label: "Phrase forte (citation)", name: "bio_quote", widget: "string" }
          - { label: "Présentation détaillée", name: "bio_long", widget: "text" }
          - label: "Mots-clés"
            name: "keywords"
            widget: "list"
            field: { label: "Mot-clé", name: "keyword", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false, hint: "Numéro international, ex : 22870123456" }
          - { label: "Ville", name: "location", widget: "string", required: false }
          - name: "socials"
            label: "Réseaux sociaux"
            widget: "object"
            fields:
              - { label: "Instagram (URL)", name: "instagram", widget: "string", required: false }
              - { label: "TikTok (URL)", name: "tiktok", widget: "string", required: false }
              - { label: "LinkedIn (URL)", name: "linkedin", widget: "string", required: false }
          - { label: "Titre — Call to action final", name: "cta_final_title", widget: "string" }
          - { label: "Sous-titre — Call to action final", name: "cta_final_subtitle", widget: "string" }

  # ------------------------------------------------------------------
  # COMPÉTENCES — fichier unique contenant une liste
  # ------------------------------------------------------------------
  - name: "skills"
    label: "Compétences"
    files:
      - name: "skills"
        label: "Liste des compétences"
        file: "content/skills/skills.json"
        fields:
          - name: "items"
            label: "Compétences"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description courte", name: "description", widget: "text" }
              - label: "URL — Image (affichée au survol)"
                name: "image"
                widget: "string"
                required: false
                hint: "URL directe de l'image (optionnel)."

  # ------------------------------------------------------------------
  # SERVICES — fichier unique contenant une liste
  # ------------------------------------------------------------------
  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "Liste des services"
        file: "content/services/services.json"
        fields:
          - name: "items"
            label: "Services"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int" }

  # ------------------------------------------------------------------
  # EXPÉRIENCES — fichier unique contenant une liste (timeline)
  # ------------------------------------------------------------------
  - name: "experiences"
    label: "Expériences"
    files:
      - name: "experiences"
        label: "Timeline d'expériences"
        file: "content/experiences/experiences.json"
        fields:
          - name: "items"
            label: "Expériences"
            widget: "list"
            summary: "{{structure}} — {{role}}"
            fields:
              - { label: "Structure", name: "structure", widget: "string" }
              - { label: "Fonction", name: "role", widget: "string" }
              - { label: "Période", name: "period", widget: "string", hint: "Ex : 2024 — 2025" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "URL — Logo / image"
                name: "logo"
                widget: "string"
                required: false
                hint: "URL directe du logo (optionnel)."

  # ------------------------------------------------------------------
  # FORMATION — fichier unique contenant une liste
  # ------------------------------------------------------------------
  - name: "education"
    label: "Formation"
    files:
      - name: "education"
        label: "Parcours de formation"
        file: "content/education/education.json"
        fields:
          - name: "items"
            label: "Formations"
            widget: "list"
            summary: "{{degree}}"
            fields:
              - { label: "Diplôme", name: "degree", widget: "string" }
              - { label: "École", name: "school", widget: "string" }
              - { label: "Période", name: "period", widget: "string", hint: "Ex : 2020 — 2023" }

  # ------------------------------------------------------------------
  # RÉALISATIONS (VIDÉOS) — fichier unique contenant une liste de partenariats
  # ------------------------------------------------------------------
  - name: "realisations"
    label: "Réalisations (Vidéos)"
    files:
      - name: "realisations"
        label: "Vidéos de partenariats"
        file: "content/realisations/realisations.json"
        fields:
          - { label: "Texte d'introduction", name: "intro", widget: "text" }
          - name: "items"
            label: "Vidéos"
            widget: "list"
            summary: "{{title}} ({{partner}})"
            fields:
              - { label: "Titre de la vidéo", name: "title", widget: "string" }
              - { label: "Partenaire / Marque", name: "partner", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "URL de la vidéo TikTok", name: "tiktok_url", widget: "string" }
              - { label: "Libellé du bouton (CTA)", name: "cta_label", widget: "string", default: "Voir sur TikTok" }
              - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int" }

  # ------------------------------------------------------------------
  # SECTION MODÈLE / FACE CAMÉRA — fichier unique contenant une liste
  # ------------------------------------------------------------------
  - name: "model"
    label: "Section Modèle"
    files:
      - name: "model"
        label: "Galerie modèle"
        file: "content/model/model.json"
        fields:
          - { label: "Texte d'introduction", name: "intro", widget: "text" }
          - name: "items"
            label: "Photos"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - label: "URL — Image"
                name: "image"
                widget: "string"
                hint: "URL directe de la photo."
              - label: "Format"
                name: "format"
                widget: "select"
                options:
                  - { label: "Portrait", value: "portrait" }
                  - { label: "Paysage", value: "landscape" }
                  - { label: "Carré", value: "square" }
                  - { label: "Plein écran", value: "full" }
              - { label: "Légende", name: "caption", widget: "string", required: false }

  # ------------------------------------------------------------------
  # COLLABORATIONS — fichier unique contenant une liste
  # ------------------------------------------------------------------
  - name: "collaborations"
    label: "Collaborations"
    files:
      - name: "collaborations"
        label: "Structures partenaires"
        file: "content/collaborations/collaborations.json"
        fields:
          - name: "items"
            label: "Collaborations"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom de la structure", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Rôle", name: "role", widget: "string", required: false }
              - label: "URL — Logo"
                name: "logo"
                widget: "string"
                required: false
                hint: "URL directe du logo (carré de préférence)."
              - { label: "Lien", name: "link", widget: "string", required: false }

  # ------------------------------------------------------------------
  # PARAMÈTRES DU SITE — SEO / réglages généraux
  # ------------------------------------------------------------------
  - name: "settings"
    label: "Réglages du site"
    files:
      - name: "settings"
        label: "Réglages généraux & SEO"
        file: "content/settings/settings.json"
        fields:
          - { label: "Titre du site (onglet navigateur)", name: "site_title", widget: "string" }
          - { label: "Meta description (SEO)", name: "meta_description", widget: "text" }
          - label: "URL — Image de partage (Open Graph)"
            name: "og_image"
            widget: "string"
            hint: "URL directe de l'image (1200x630 px recommandé pour les partages Facebook/LinkedIn)."
          - { label: "URL du site en production", name: "site_url", widget: "string" }
          - { label: "Nom affiché dans la navigation", name: "nav_brand", widget: "string" }
          - { label: "Texte du bouton de contact (navigation)", name: "cta_nav_label", widget: "string" }
