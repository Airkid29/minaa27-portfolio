<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration — MINAA Portfolio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <!-- Netlify Identity gère la connexion à l'espace admin. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS (anciennement Netlify CMS) : CMS Git-based, sans base de données. -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <script>
    // Gestion complète des événements Netlify Identity :
    // - Invitation acceptée → redirection /admin/
    // - Récupération de mot de passe → redirection /admin/
    // - Connexion classique → redirection /admin/
    // - Confirmation d'email → redirection /admin/
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          window.netlifyIdentity.on("login", function() {
            document.location.href = "/admin/";
          });
          window.netlifyIdentity.on("signup", function() {
            document.location.href = "/admin/";
          });
          window.netlifyIdentity.on("passwordRecovery", function() {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
